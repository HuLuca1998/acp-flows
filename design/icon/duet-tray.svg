<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="170 170 684 684" role="img" aria-label="Duet">
  <title>Duet · 菜单栏</title>

  <!--
    Duet 菜单栏图标 - source of truth。重新生成：
        ./scripts/gen/gen-icons.sh
    不要手改 shell/src-tauri/icons/tray-*.png。

    ★ 与 app 图标（duet.svg）的三个区别，每一条都是 macOS 菜单栏的硬要求：

      1. **纯黑 + alpha，不带任何颜色**。菜单栏图标是 template image：
         系统按明暗主题自动反色，浅色壁纸下变黑、深色壁纸下变白。
         带颜色的图会被系统当成普通图片，在深色菜单栏上糊成一团。
         配置里必须同时开 iconAsTemplate: true。

      2. **没有背景板**。app 图标有圆角矩形底（Dock 里需要），
         菜单栏图标只有标记本身——加了底会变成一个突兀的黑方块。

      3. **线更粗、留白更少**。菜单栏实际显示只有 22pt，
         按 app 图标的比例缩下去会细到看不清。
         这里把描边从 84 加到 104，标记外扩到接近画布边缘。

    几何：两段 120 度圆弧（r=232，圆心 512,512），12 点与 6 点方向各留
    60 度开口；中心点 r=64（app 图标是 52，小尺寸下要更实）。

    ★ viewBox 收紧到 170 170 684 684：让标记铺满画布的约 85%。

      **这个数调过三次**，因为菜单栏图标的坑不在留白而在**视觉密度**：
      这个标记是两道弧 + 一个点，中间是空的，同样外框尺寸下
      看起来比邻居那些实心图标轻得多。
        · 0 0 1024 1024（不留白）→ 顶满 22pt，比邻居大
        · -160（留 12%）、-56（留 5%）→ 都明显**比邻居小一圈**
        · 170 170 684 684（标记占 85%）+ 描边加粗到 120 → 与邻居视觉齐平
      结论：稀疏的标记要按**视觉重量**配尺寸，不能按外框比例配。
  -->

  <!-- Claude，左边那道声部 -->
  <path d="M 396 712.92 A 232 232 0 0 1 396 311.08"
        fill="none" stroke="#000" stroke-width="120" stroke-linecap="round"/>

  <!-- Codex，右边那道声部 -->
  <path d="M 628 311.08 A 232 232 0 0 1 628 712.92"
        fill="none" stroke="#000" stroke-width="120" stroke-linecap="round"/>

  <!-- 两个声部共同在做的那个单元 -->
  <circle cx="512" cy="512" r="72" fill="#000"/>
</svg>
