openapi: 3.1.0

# ══════════════════════════════════════════════════════════════════════════
# 前后端接口的唯一真源。改接口的顺序永远是：
#   ① 改本文件  →  ② make gen  →  ③ 改 Go 实现 / TS 调用
# 反过来做即视为不合规（铁律 2）。CI 的 contract job 会重新生成并比对 diff。
#
# 约定见 api/AGENTS.md。当前只覆盖 M0/M1 的端点，M2+ 随里程碑增补。
# ══════════════════════════════════════════════════════════════════════════

info:
  title: Duet API
  version: 0.1.0
  description: |
    duetd 对外暴露的全部接口。Tauri 壳与浏览器走的是同一套 —— 壳不得通过 IPC 绕过 HTTP。

    **错误文案**：`Problem.type` 是机器可读错误码，前端据此查 i18n 词条；
    `detail` 只给开发者看，界面不展示。后端绝不返回用户可见的中文文案（见 docs/rules/i18n.md §3）。

servers:
  - url: http://127.0.0.1:{port}/v1
    variables:
      port:
        default: '7777'

security:
  - bearerAuth: []

tags:
  - name: system
    description: 版本、更新、恢复
  - name: runtime
    description: ACP Runtime 探测与管理
  - name: project
    description: 本地项目的添加、列出与移除
  - name: work
    description: 一次工作的创建与查看

paths:
  # ── 系统 ────────────────────────────────────────────────────
  /system/version:
    get:
      tags: [system]
      operationId: getVersion
      summary: 当前版本与构建信息
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionInfo' }

  /system/update/check:
    post:
      tags: [system]
      operationId: checkUpdate
      summary: 主动检查应用更新
      description: |
        对应设置页的「检查更新」按钮。**只检查，绝不下载、绝不安装**（见 docs/adr/0002）。
        下载与安装由 Tauri updater 完成，duetd 不碰安装包。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateStatus' }

  /system/update/prepare:
    post:
      tags: [system]
      operationId: prepareUpdate
      summary: 更新前暂停所有工作并保存检查点
      description: |
        ★ 这不是形式步骤，是一次跨聚合的领域操作。用户点「一键更新并重启」后
        **先调本接口，再下载**。

        对每个非终态的 Work：两段式取消 → 采集证据与事件游标 → 落检查点 → `paused`。

        返回 `blocked` 时前端**不得继续安装**，要把卡住的工作显示给用户。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdatePrepareResult' }
        default: { $ref: '#/components/responses/Problem' }

  /system/resume:
    get:
      tags: [system]
      operationId: listResumable
      summary: 列出可从检查点恢复的工作
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [resumable]
                properties:
                  resumable:
                    type: array
                    items: { $ref: '#/components/schemas/ResumableWork' }

  # ── 事件流 ──────────────────────────────────────────────────
  /events:
    get:
      tags: [system]
      operationId: streamEvents
      summary: 事件流（SSE）
      description: |
        ★ **这是 SSE，不是普通 JSON 响应**：`text/event-stream`，长连接。

        断线重连时带 `Last-Event-ID`（标准 SSE 头），服务端**只补它之后的**。
        从头补的话用户会看到整条时间线重放一遍；补少了则中间有洞，
        而洞是看不出来的——用户不知道自己漏了什么。

        每条 SSE 消息的 `id` 就是事件的 `seq`，浏览器的 EventSource 会自动
        把它记进 `Last-Event-ID`，重连时原样带回来。
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: integer, format: int64 }
          description: 上次收到的最后一个 seq；不带表示全新连接
      responses:
        '200':
          description: 事件流
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  每条形如：

                      id: 42
                      event: message_chunk
                      data: {"id":"evt_...","seq":42,...}

                  `data` 是一个完整的 Event 对象。
        default: { $ref: '#/components/responses/Problem' }

  # ── Project ─────────────────────────────────────────────────
  /projects:
    get:
      tags: [project]
      operationId: listProjects
      summary: 已添加的本地项目
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
    post:
      tags: [project]
      operationId: addProject
      summary: 把一个本地代码文件夹加进来
      description: |
        ★ **这个动作往用户的项目目录里写零个字节。** 只登记路径。
        顺手初始化 `.acpflows/` 目录结构是很自然的想法，但用户刚把自己的仓库
        加进来、`git status` 就多出一堆没见过的东西，是最快失去信任的方式。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: 本地绝对路径
                  examples: ['/Users/me/work/my-app']
      responses:
        '201':
          description: 已添加
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Problem' }

  /projects/{id}:
    delete:
      tags: [project]
      operationId: removeProject
      summary: 移除项目（只取消登记，**不删用户的文件**）
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '204': { description: 已移除 }
        default: { $ref: '#/components/responses/Problem' }

  # ── Work ────────────────────────────────────────────────────
  /works:
    get:
      tags: [work]
      operationId: listWorks
      summary: 全部工作
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [works]
                properties:
                  works:
                    type: array
                    items: { $ref: '#/components/schemas/Work' }
    post:
      tags: [work]
      operationId: startWork
      summary: 对一个项目提需求，开一个工作
      description: |
        切一个独立 worktree、建 ACP 会话、开始澄清需求。

        ★ worktree 建在 `~/.acpflows/worktrees`，**不在用户的项目目录里**
        （见 docs/plan/open-questions.md Q30）。用户把代码目录交给 Duet 时，
        并没有同意我们在他的仓库里造一堆分支和目录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, prompt]
              properties:
                project:
                  type: string
                  description: 项目的本地绝对路径
                prompt:
                  type: string
                  description: 用户的需求原话
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Work' }
        default: { $ref: '#/components/responses/Problem' }

  # ── Runtime ─────────────────────────────────────────────────
  /works/{id}/cancel:
    post:
      tags: [work]
      operationId: cancelWork
      summary: 停下这个工作正在跑的那一轮
      description: |
        ★ **不是所有状态都能停。** 审查中的工作会被拒绝（`work_cancel_not_allowed`）——
        独立审查正在产出证据，半路掐掉的话那个单元既没通过也没被驳回，
        卡在一个说不清的状态里。

        正常停下之后工作进入 `paused`，并落一条 `checkpoint` 事件——
        用户回头想接着干，得有东西告诉他「上次停在哪」。

        ★ **Agent 停不下来时会被强制结束**，工作进入 `failed`。
        这一步是「界面说已取消、后台还在烧钱改文件」的唯一防线：
        只报错不杀的话，用户以为什么都没发生。那时本端点仍返回错误，
        但工作状态与事件都已经落好。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: 已停下
        default: { $ref: '#/components/responses/Problem' }

  /works/{id}/permission:
    post:
      tags: [work]
      operationId: answerPermission
      summary: 应答一次权限请求
      description: |
        Agent 想动用户的东西时会发一条 `request_permission` 事件到时间线，
        **并把这一轮挂起等应答**。用户在界面上点了某个选项，就走这个端点送回去。

        ★ `option_id` 是 **Agent 自己定义的不透明字符串**，从事件载荷的
        `options[].option_id` 原样取，**不要自己造、也不要按类别重新匹配**。
        搞错的话，用户点「拒绝」而 Agent 收到「允许」——这是整个权限体系里
        后果最严重的一种错。

        ★ 同一条请求**只能应答一次**。重复应答返回 409 且不再向 Agent 发第二条：
        Agent 那边只在等一个响应，多发的会被当成不认识的请求而静静丢弃，
        界面上却什么提示都没有。

        ★ 这个端点**不做超时**。用户可能去泡了杯咖啡；替他超时等于替他做决定。
        要中止只能靠取消整个工作（那时所有 pending 的请求都会收到 `cancelled`）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: 工作标识
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ask_id, option_id]
              properties:
                ask_id:
                  type: string
                  description: 事件载荷里的 `ask_id`，标识是哪一条请求
                option_id:
                  type: string
                  description: |
                    用户选的那个选项的 `option_id`，**原样回传**。
      responses:
        '204':
          description: 已送达 Agent
        default: { $ref: '#/components/responses/Problem' }

  /runtimes:
    get:
      tags: [runtime]
      operationId: listRuntimes
      summary: Runtime 列表、版本、探针结果
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [runtimes]
                properties:
                  runtimes:
                    type: array
                    items: { $ref: '#/components/schemas/Runtime' }

  /runtimes/{name}/probe:
    post:
      tags: [runtime]
      operationId: probeRuntime
      summary: 重新探测能力矩阵
      parameters:
        - $ref: '#/components/parameters/RuntimeName'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityMatrix' }
        default: { $ref: '#/components/responses/Problem' }

  # ── 角色 · Skill · 记忆（M2）────────────────────────────────
  /roles:
    get:
      tags: [role]
      operationId: listRoles
      summary: 角色与 Runtime 绑定表
      description: |
        八个预置角色。**顺序就是设计稿角色表的行序**，界面照这个顺序渲染。

        ★ `session_mode` 是**语义档**（`read_only` / `guarded_write` /
        `unrestricted`），不是某一端的档名——两端档名一个都不重合，
        返回档名的话前端就得认识 `plan` / `read-only` 这些品牌相关的取值。
        要展示实际档名时用 `mode_name`，它是后端翻译好的。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }

  /skills:
    get:
      tags: [skill]
      operationId: listSkills
      summary: Skill 库
      parameters:
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [project, global] }
          description: 不传时返回全局库
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [skills]
                properties:
                  skills:
                    type: array
                    items: { $ref: '#/components/schemas/Skill' }
        default: { $ref: '#/components/responses/Problem' }

  /memories:
    get:
      tags: [memory]
      operationId: listMemories
      summary: 记忆库
      parameters:
        - name: scope
          in: query
          required: false
          schema: { type: string }
          description: |
            项目名（L2）或 `*`（L3 跨项目）。不传时返回全部。
            ★ 项目之间**永不串味**（INV-MEM-1）——两个项目的约定常常正好相反。
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/MemoryStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [memories]
                properties:
                  memories:
                    type: array
                    items: { $ref: '#/components/schemas/Memory' }
        default: { $ref: '#/components/responses/Problem' }

  /memories/{id}/review:
    post:
      tags: [memory]
      operationId: reviewMemory
      summary: 人工审核一条候选记忆
      description: |
        ★★ **绝不自动写入**（INV-MEM-2）。`candidate → active` 只能走这个端点，
        且必须带上 `actor`——AI 没有任何路径能自己把候选变成生效。

        错了的后果不是「多一条记忆」，而是 AI 把自己的一次臆断
        变成了以后每一轮的前提，而用户从没看过那句话。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, actor]
              properties:
                decision:
                  type: string
                  enum: [confirm, reject]
                actor:
                  type: string
                  description: 是谁做的决定。**必填**，空值一律拒绝
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Memory' }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        duetd 启动时生成一次性 token，写入 `~/.acpflows/runtime/session.json`（0600）。
        无 token 一律 401 —— 防止本机其他程序静默驱动 Agent 写用户的代码。

  parameters:
    ProjectID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^proj-[0-9A-Za-z]+$'
      description: 项目标识，形如 `proj-01`

    RuntimeName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]{0,31}$'
        examples: [claude, codex]
      description: |
        Runtime 标识。**不是封闭枚举** —— Runtime 是注册表（见 docs/adr/0006 Q13），
        加第 3 个 runtime 只加一个包 + 登记一行，不改契约。
        取值合法性由服务端查注册表校验。

  responses:
    Problem:
      description: 错误（RFC 9457）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    PermissionOption:
      type: object
      required: [option_id, name, kind]
      description: |
        Agent 给出的一个可选应答。

        ★ `option_id` 是 **Agent 自己定义的不透明字符串**。界面上原样带着它，
        应答时原样送回——不要自己造、不要按 `kind` 重新匹配、不要排序后取第一个。
      properties:
        option_id: { type: string, examples: ['opt-allow'] }
        name:
          type: string
          description: |
            Agent 给的按钮文字。**照它显示**，不要替换成我们自己的说法——
            Agent 可能给出「这个目录以后都允许」这种我们想不到的选项。
          examples: ['允许一次']
        kind:
          type: string
          description: 只用来决定按钮的颜色，**不用来挑 option_id**。
          enum: [allow_once, allow_always, reject_once, reject_always]

    PermissionAskPayload:
      type: object
      required: [ask_id, tool_call_id, runtime, options]
      description: |
        `type = request_permission` 的事件载荷。

        ★ 这一轮**挂着等应答**，没有超时。用户不点，AI 就一直等——
        那是刻意的：替他超时等于替他做决定。
      properties:
        ask_id:
          type: string
          description: 应答时带回去，标识是哪一条请求。
        tool_call_id:
          type: string
          description: 对应时间线上的哪一次工具调用。
        runtime:
          type: string
          description: 哪个 Agent 在问——用户可能同时开着 claude 与 codex。
          examples: ['codex']
        kind:
          type: string
          description: |
            工具类别，界面据此说人话（「请求读取」/「请求写入」/「请求执行」）。
            取值同 ACP 的 ToolKind；认不出时界面用兜底文案，不显示原始码。
          examples: ['edit']
        path:
          type: string
          description: 涉及的文件路径。Agent 不一定给得出（比如执行命令）。
        out_of_bounds:
          type: boolean
          description: |
            是否越出了这个单元声明的写入边界。

            ★ **没有依据时不要填 true。**「写入边界外」是一句很重的话，
            乱说的话用户会对所有提示脱敏，真正越界那次他也不会看。
        options:
          type: array
          items: { $ref: '#/components/schemas/PermissionOption' }

    # ── 错误 ──────────────────────────────────────────────────
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: |
            ★ 机器可读错误码（snake_case），**前端据此查 i18n 词条**。
            新增取值时必须同步加进 zh-CN.json 与 en-US.json，make check-i18n 会校验。
          examples: [contract_frozen, runtime_not_installed, cancel_timeout]
        title: { type: string, description: 简短英文标题，仅供开发者 }
        status: { type: integer }
        detail:
          type: string
          description: 英文调试信息。**界面不直接展示**，见 docs/rules/i18n.md §3。
        params:
          type: object
          additionalProperties: true
          description: 结构化参数，供前端词条插值。
        instance: { type: string }

    # ── 系统 ──────────────────────────────────────────────────
    VersionInfo:
      type: object
      required: [version, platform, arch]
      properties:
        version: { type: string, examples: ['1.4.2'] }
        platform: { type: string, examples: ['macOS 15.3'] }
        arch: { type: string, examples: ['arm64'] }
        commit: { type: string }
        built_at: { type: string, format: date-time }

    UpdateStatus:
      type: object
      required: [state, current_version]
      properties:
        state:
          type: string
          enum: [idle, available, unsupported]
          description: unsupported = Web 版，无法自动更新
        current_version: { type: string }
        latest_version: { type: string }
        notes: { type: string, description: 取自 CHANGELOG，更新卡片原样显示 }
        size_bytes: { type: integer, format: int64 }
        published_at: { type: string, format: date-time }

    UpdatePrepareResult:
      type: object
      required: [status, prepared, blocked]
      properties:
        status:
          type: string
          enum: [ready, blocked]
          description: blocked 时前端不得继续安装
        prepared:
          type: array
          items:
            type: object
            required: [work_id, checkpoint_id]
            properties:
              work_id: { type: string, examples: ['work-08'] }
              checkpoint_id: { type: string, examples: ['ck-09'] }
        blocked:
          type: array
          items:
            type: object
            required: [work_id, reason]
            properties:
              work_id: { type: string }
              reason:
                type: string
                description: 机器可读原因码，前端翻译
                examples: [cancel_timeout, runtime_unresponsive]
              elapsed_seconds: { type: integer }

    ResumableWork:
      type: object
      required: [work_id, checkpoint_id]
      properties:
        work_id: { type: string }
        checkpoint_id: { type: string }
        unit_id: { type: string }
        paused_at: { type: string, format: date-time }

    # ── Project ───────────────────────────────────────────────
    Project:
      type: object
      required: [id, name, path, is_git_repo]
      properties:
        id: { type: string, examples: ['proj-01'] }
        name:
          type: string
          description: 目录名，展示用；用户可改而不影响 path
        path:
          type: string
          description: 本地绝对路径
        is_git_repo:
          type: boolean
          description: |
            ★ 不是 git 仓库**也允许添加**，只是标出来。
            直接拒绝的话，用户得先去命令行 `git init` 才能用这个产品——
            而他很可能正是不想碰命令行才来用的。
        default_branch:
          type: string
          description: 仓库的默认分支；非 git 仓库时缺省
        remedy:
          type: object
          description: 需要用户做点什么时给出的整条命令，与 Runtime.remedy 同一套做法
          properties:
            command:
              type: string
              examples: ['git init']

    # ── Work ──────────────────────────────────────────────────
    Work:
      type: object
      required: [id, state]
      description: |
        一次工作。`state` 是**封闭枚举**，与 backend/internal/constant 的
        WorkState 一一对应；新增取值要同时改三处：本文件 + 那个常量 +
        状态迁移表（domain/model/work.go）。
      properties:
        id: { type: string, examples: ['work-01'] }
        state:
          type: string
          description: |
            ★ `initializing_failed` 是**终态、不可恢复** —— worktree 没切成
            就没有可执行的现场（docs/adr/0006 Q1）。界面上不该给「重试」按钮。
          enum:
            - initializing
            - initializing_failed
            - clarifying
            - planning
            - ready
            - executing
            - reviewing_unit
            - waiting_user
            - paused
            - completed
            - failed
        project:
          type: string
          description: 项目的本地绝对路径
        worktree:
          type: string
          description: 这个工作的独立工作区；**在用户项目之外**
        prompt:
          type: string
          description: 用户的需求原话

    # ── Runtime ───────────────────────────────────────────────
    Role:
      type: object
      required: [id, display_name, operations, session_mode, permission_policy, runtime_name, is_preset]
      properties:
        id:
          type: string
          description: 角色标识，不是封闭枚举（用户可加自定义角色）
          examples: [implementer, unit_reviewer, memory_curator]
        display_name: { type: string, examples: [实现工程师] }
        operations:
          type: array
          items: { type: string }
          description: |
            承担的 AI 操作。11 个操作**每个恰好有一个角色认领**（INV-ROLE-6）——
            漏派的话跑到那一步才发现没人干，而那时计划已经排好了。
          examples: [[implement]]
        duty: { type: string, description: 职责 }
        personality: { type: string, description: 性格与提示语气 }
        boundary:
          type: string
          description: 边界——这个角色明令不做的事。**是可测的约束，不是文案**
        output: { type: string, description: 产出物 }
        session_mode:
          type: string
          enum: [read_only, guarded_write, unrestricted]
          description: |
            **语义**档位，不是某一端的档名。
            存档名的话，用户把角色从 claude 换到 codex 时那个档不存在，
            保存会被拒——而「改绑 Runtime 不该改变任何行为」是硬要求。
        mode_name:
          type: string
          description: |
            后端翻译好的、在**当前绑定的 Runtime** 上的实际档名，只用于展示。
            前端不许自己翻译——那需要认识品牌名。
          examples: [default, plan, read-only]
        permission_policy:
          type: string
          enum: [ask_each, auto_allow_read]
          description: 权限裁决。★ 只有这两个取值，设计稿里**没有**「一律拒绝」
        runtime_name:
          type: string
          description: 当前绑定的 Runtime（推荐绑定可被用户覆盖）
        is_preset: { type: boolean }
        problem:
          type: string
          description: |
            绑定查不到或档位翻译不出来时的原因。
            ★ 出问题的角色**照样返回**，只是带着这一条——
            跳过的话用户看到七个角色，而他不知道少了哪一个、为什么少。

    Skill:
      type: object
      required: [name, dir, scope, source, status, validation_ok]
      properties:
        name: { type: string, examples: [rust-test-first] }
        dir: { type: string, description: 目录名；frontmatter 缺 name 时它就是显示名 }
        version:
          type: string
          description: '`主.次` 两段，与应用版本的三段不是一回事'
          examples: ['2.1']
        description: { type: string }
        compatibility: { type: string, examples: ['cargo >= 1.80'] }
        scope: { type: string, enum: [project, global] }
        source:
          type: string
          description: |
            扫到它的目录约定。**必须给**——不标来源的话，
            用户不知道 Duet 翻了他哪些目录。
          examples: ['.acpflows/skills', '.claude/skills']
        status:
          type: string
          enum: [draft, active, deprecated]
          description: ★ 扫出来的一律是 `draft`（INV-SKL-1）——扫盘就直接 active 的话，用户往目录里丢个文件就等于让它进了注入清单
        validation_ok: { type: boolean }
        validation_reason:
          type: string
          description: |
            没通过时**必须**说清为什么（INV-SKL-2），且直接可显示。
            静默拒绝的话用户只能删了重建，而重建出来还是 draft。
          examples: ['校验未通过：frontmatter 缺 description']
        hit_count: { type: integer, description: 命中计数 }

    MemoryStatus:
      type: string
      enum: [candidate, active, discarded, invalid, obsolete]
      description: |
        ★ **五态**。设计稿筛选器只有三档（active / 候选 / 已失效），
        那是**界面的分组**：「已失效」同时装着 `invalid` 与 `obsolete`——
        对用户长得一样，对系统不一样（废弃要带理由、可指向 supersedes）。

    Memory:
      type: object
      required: [id, kind, scope, status, source_refs, injectable]
      properties:
        id: { type: string, examples: [mem-203] }
        kind: { type: string, enum: [constraint, experience, fact] }
        scope:
          type: string
          description: 项目名（L2）或 `*`（L3 跨项目）
          examples: [acp-engine, '*']
        status: { $ref: '#/components/schemas/MemoryStatus' }
        source_refs:
          type: array
          items: { type: string }
          description: |
            依据，指向 Evidence 或 Unit。**必填**（INV-MEM-3）——
            空着的话 AI 的一句臆断就能变成以后每一轮的前提。
          examples: [[ev-412, unit-009]]
        created_by: { type: string, examples: [memory_curator] }
        confirmed_by:
          type: string
          description: |
            是谁确认的。★ `candidate → active` **必须有人的动作**（INV-MEM-2），
            空值表示还没人拍板。
        reason: { type: string, description: 废弃理由（obsolete 才有） }
        supersedes: { type: string, description: 被本条取代的记忆 }
        injectable:
          type: boolean
          description: |
            能不能进**新的**注入清单。只有 active 能进——
            候选进了就等于自动写入，而失效的仍要能在历史记录里解析出来。
        history_len: { type: integer, description: 变更历史条数，只增不减 }

    Runtime:
      type: object
      required: [name, installed, status]
      properties:
        name:
          type: string
          description: Runtime 标识，来自注册表；不是封闭枚举
          examples: [claude, codex]
        status:
          type: string
          enum: [ready, not_installed, not_authenticated, probe_failed]
          description: |
            ★ **三态之外必须有第四态 `probe_failed`。**
            只用 `installed` / `authenticated` 两个布尔表达不了「检测本身失败了」——
            那时 `installed=false` 与「确实没装」无法区分，界面会把一个
            可能是假的结论告诉用户，还附上一句「请先安装」。
            检测不出来就说检测不出来，不猜。
        remedy:
          type: object
          description: |
            怎么修。**命令由后端给，前端不许按 `name` 拼**——
            `if name === 'codex'` 出现在 adapter 之外即视为设计失败
            （见 docs/rules/design-principles.md §4.4）。
            前端只把 `command` 原样显示出来，文案按 `status` 查 i18n 词条。
          properties:
            command:
              type: string
              description: 用户可以直接复制去终端敲的一整条命令
              examples: ['codex login', 'npm i -g @anthropic-ai/claude-code']
        installed: { type: boolean }
        active_version: { type: string, examples: ['0.63.0'] }
        available_versions:
          type: array
          items: { type: string }
          description: 多版本并存，切换出问题可一键退回
        path: { type: string }
        authenticated: { type: boolean }
        protocol_version: { type: integer }
        capabilities: { $ref: '#/components/schemas/CapabilityMatrix' }

    CapabilityMatrix:
      type: object
      required: [passed, total, probes]
      description: |
        ★ 上层靠能力查询做降级判断，**绝不靠 Runtime 名字**。
        `if runtime == "codex"` 出现在 adapter 之外即视为设计失败，
        见 docs/rules/design-principles.md §4.4。
      properties:
        passed: { type: integer }
        total: { type: integer }
        probes:
          type: array
          items:
            type: object
            required: [id, passed]
            properties:
              id: { type: string, examples: [streaming_thoughts, permission_request] }
              passed: { type: boolean }
              detail: { type: string }

    # ── 事件信封（SSE，端点随 M2 增补）────────────────────────
    Event:
      type: object
      required: [id, seq, source, type, ts]
      description: |
        统一事件信封。`type` 是**封闭枚举，共 13 类**，与 design/Duet Spec.dc.html
        第 07 节一一对应。新增一类要同时改四处：本文件 + docs/spec/architecture.md §4
        + Duet Spec + 前端渲染器注册表。四处缺一不可。

        `seq` 单调递增且持久化 —— 「取消后最后事件游标可读」是产品硬需求。
      properties:
        id: { type: string }
        seq: { type: integer, format: int64 }
        work_id: { type: string }
        source: { type: string, enum: [acp, app] }
        type:
          type: string
          enum:
            # 来自 ACP Runtime
            - message_chunk
            - thought_chunk
            - tool_call
            - request_permission
            - turn_end
            # 来自应用控制层（这些永远可点开到对应的结构化产物）
            - plan_version
            - unit_contract
            - state_change
            - injection
            - memory_candidate
            - decision
            - evidence
            - checkpoint
        ts: { type: string, format: date-time }
        payload:
          type: object
          description: |
            按 `type` 变化的载荷。**开放形状**（`additionalProperties: true`）——
            ACP 的原始字段原样带上，前端认得的自己取，认不得的排查时也能看到全貌。

            我们自己加的字段一律 `acp_` 前缀，永远不和 Agent 的字段撞名。
            这条是踩出来的：翻译层曾经用 `kind` 覆盖了 ACP `tool_call` 自带的
            `kind`（工具种类），结果同一个键有时是判别值有时是工具类别。

            `type = request_permission` 的形状见 `PermissionAskPayload`。
            它是**唯一需要前端按字段读**的一类，因为用户要照着它点按钮。

            ★ 故意**不**用 `oneOf` 把它绑进这里：那样会把所有事件的
            payload 类型一起收紧，而我们本来就打算把 ACP 的字段原样透传。
            代价是前端要自己按那个 schema 解析——`features/permission`
            的 `toRequest` 做这件事，缺字段时跳过而不是白屏。
          additionalProperties: true
