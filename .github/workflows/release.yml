# ⛔ **这条 workflow 已被 `gh workflow disable` 停用（2026-08-08）。**
#
# 发版改在本机做：
#
#     bash scripts/release/publish-local.sh 0.0.1
#
# 为什么：macOS runner 按 **10 倍**计费，而 universal 包要编两个架构的 Rust。
# 真发版试了三次，两次挂在环境上（rust target 被 rust-cache 覆盖、门禁红），
# 每次都是十几分钟额度换一条错误信息。本机编译不花额度、出问题当场能看能改。
#
# **不要顺手把它重新启用。** 要恢复 CI 发版得先解决两件事：
#   ① macOS 额度够不够（一次成功的 universal 构建约 8–12 分钟 × 10 倍）
#   ② 私钥仍在 GitHub Secrets 里（`TAURI_SIGNING_PRIVATE_KEY`），
#      它还在，所以恢复只需要 `gh workflow enable release.yml`
#
# 文件保留不删：本机脚本与它的步骤是一一对应的，将来恢复时这里就是参照。

name: release

# 只手动触发，且**只在 main 上跑**。两个理由（前一个项目 ai-workflows 实测，
# 见 docs/adr/0007）：
#
# 1. **缓存能命中**：GitHub Actions 的缓存有 ref 作用域——一个 run 只能读
#    「自己这个 ref」和「默认分支」的缓存。用 tag 触发时，每个 tag 写的缓存
#    只对自己可见，下一次发版换了 tag 就读不到，等于每次发版从零编译整个
#    依赖树（实测 6 分钟）。在 main 上跑，作用域一直是 main。
# 2. **省额度**：macOS runner 按 10 倍计费，而绝大多数提交没人会去装。
#
# tag 由 tauri-action 在发布时创建，不需要预先打。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '正式版版本号，如 0.2.0。留空则发预发布快照（不会成为 latest）'
        type: string
        default: ''
      dry_run:
        description: '只构建不发布（验证流水线本身）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 版本解析与幂等检查放 Linux（1 倍计费）────────────────────
  # 重发一个已存在的版本时，macOS runner 根本不会启动。
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      exists: ${{ steps.existing.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes 要读 git log

      # 版本策略：
      #   填了 version → 正式版，标记 latest，成为已安装用户的更新目标
      #   留空        → 预发布快照，不会成为 latest
      - name: 解析版本
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA:0:7}"
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            version="${INPUT_VERSION#v}"
            if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "✗ 版本号格式不对: $version（应为 X.Y.Z）" >&2
              exit 1
            fi
            prerelease=false
          else
            version="0.0.0-snapshot.$(date -u +%Y%m%d).${sha}"
            prerelease=true
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "→ $version（prerelease=$prerelease）"

      - name: 幂等检查
        id: existing
        run: |
          set -euo pipefail
          if gh release view "${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::${{ steps.meta.outputs.tag }} 已存在，跳过构建（流水线是幂等的）"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 不把坏版本推给用户，比早十分钟发布重要。
      - name: 发布门禁
        if: steps.existing.outputs.exists != 'true'
        run: make check-docs && make check-doc-commands && make check-doc-budget && make check-index

      # ★ 签名密钥没配就**在这里失败**，别让 macOS runner 白跑。
      #
      # 没有它 tauri-action 会一路跑到打包完才报
      # `failed to sign updater artifact`，那时已经烧掉十几分钟的
      # 10 倍计费额度，而报错信息还看不出根因。
      - name: 前置检查 · 更新签名密钥
        if: ${{ !inputs.dry_run }}
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::error::缺少 secret TAURI_SIGNING_PRIVATE_KEY —— 客户端会拒绝一切更新。"
            echo "补齐方式（**必须由人执行**，不要让 AI 代做）："
            echo "  gh secret set TAURI_SIGNING_PRIVATE_KEY < ~/.duet-updater/updater.key"
            echo "  gh secret set TAURI_SIGNING_PRIVATE_KEY_PASSWORD --body \"\""
            echo "密钥还没生成的话见 docs/spec/release-and-update.md「私钥存三处」。"
            exit 1
          fi
          echo "✓ 更新签名密钥已配置"

      - name: 生成 release notes
        if: steps.existing.outputs.exists != 'true'
        run: bash scripts/release/release-notes.sh "${{ steps.meta.outputs.tag }}" > notes.md

      - uses: actions/upload-artifact@v4
        if: steps.existing.outputs.exists != 'true'
        with: { name: release-notes, path: notes.md, retention-days: 1 }

  # ── 构建与发布 ───────────────────────────────────────────────
  build:
    name: build
    needs: plan
    if: needs.plan.outputs.exists != 'true'
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: release-notes }

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: '**/pnpm-lock.yaml' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin,x86_64-apple-darwin }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: shell/src-tauri }

      # ★ 真踩过（2026-08-08，0.0.1 首次发版失败）：上面 rust-toolchain 的
      # targets 参数已经声明了两个架构，构建时却报
      #   `Target x86_64-apple-darwin is not installed
      #    (installed targets: aarch64-apple-darwin)`
      # rust-cache 会缓存并恢复 ~/.rustup，把刚装好的 target 覆盖掉。
      # 显式补一次是幂等的，几秒钟，换掉一次「编译三分钟后才失败」。
      #
      # universal-apple-darwin 是**两个真实架构的合并**，两个都得在。
      - name: 补齐 rust target（rust-cache 会覆盖掉 toolchain 的 targets）
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # 版本号只在发布时注入，仓库里始终是 0.0.0 ——
      # 避免每次发版都产生一次「bump version」提交（adr/0007 修订 2）。
      - name: 注入版本号
        run: |
          set -euo pipefail
          conf=shell/src-tauri/tauri.conf.json
          tmp=$(mktemp)
          jq --arg v "${{ needs.plan.outputs.version }}" '.version = $v' "$conf" > "$tmp"
          mv "$tmp" "$conf"
          jq -r '.version' "$conf"

      # duetd 作为 Tauri sidecar，文件名必须带 target triple 后缀
      - name: 编译 duetd 与前端 dist
        run: |
          # 第二次跳过前端：dist 与架构无关，重复编是在 10 倍计费的
          # macOS runner 上白烧一分多钟。
          bash scripts/release/build.sh --target aarch64-apple-darwin
          bash scripts/release/build.sh --target x86_64-apple-darwin --skip-frontend

      - name: 检测 Apple 证书
        id: signing
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "${CERT:-}" ]; then
            echo "apple=true" >> "$GITHUB_OUTPUT"
          else
            echo "apple=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 Apple 证书：产物做 ad-hoc 签名，安装时跑 scripts/release/install-app.sh"
          fi

      # ★ 必须是两个互斥的步骤，不能靠 tauri-action 自己判空。
      # GitHub Actions 无法条件性地「不设置」一个 env——secret 不存在时它是
      # 空字符串，tauri-action 会拿空串去导入钥匙串，报
      # `failed to import keychain certificate`。（adr/0007 修订 4，实测踩过）

      - name: 构建并发布（含 Apple 签名与公证）
        if: ${{ !inputs.dry_run && steps.signing.outputs.apple == 'true' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: shell
          tagName: ${{ needs.plan.outputs.tag }}
          releaseName: ${{ needs.plan.outputs.tag }}
          releaseBodyPath: notes.md
          releaseDraft: false
          prerelease: ${{ needs.plan.outputs.prerelease }}
          includeUpdaterJson: true
          args: --target universal-apple-darwin

      - name: 构建并发布（ad-hoc 签名，未公证）
        if: ${{ !inputs.dry_run && steps.signing.outputs.apple != 'true' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # 更新包仍然签名——那用的是我们自己的 minisign 密钥，与 Apple 证书无关。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ★ ad-hoc 签名（identity "-"）：免费、不需要任何 Apple 账号。
          # Apple Silicon 要求 arm64 可执行文件必须有签名——只靠链接器那份
          # linker-signed 不覆盖 bundle，Gatekeeper 会直接判「已损坏」。
          # 加上这行才退化成正常的「未认证开发者」提示，那一层由
          # scripts/release/install-app.sh 解除隔离标记来过。（adr/0007 修订 5，实测踩过）
          APPLE_SIGNING_IDENTITY: '-'
        with:
          projectPath: shell
          tagName: ${{ needs.plan.outputs.tag }}
          releaseName: ${{ needs.plan.outputs.tag }}
          releaseBodyPath: notes.md
          releaseDraft: false
          prerelease: ${{ needs.plan.outputs.prerelease }}
          includeUpdaterJson: true
          args: --target universal-apple-darwin

      # dry run 也走签名与 ad-hoc：不签的话这条流水线验证不到签名链路，
      # 而那恰恰是最容易在真发版当天才炸的一环。
      - name: 仅构建（dry run）
        if: ${{ inputs.dry_run }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: '-'
        run: cd shell && pnpm install --frozen-lockfile && pnpm tauri build --target universal-apple-darwin

      # 产出物齐不齐**在流水线里断言**，不靠人事后去 Release 页面数。
      # 少一类就是「用户装得上但更新不了」，而那要等到下一次发版才会暴露。
      - name: 校验四类产物齐备
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          names=$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(" ")')
          echo "产物: $names"
          for pat in '\.dmg$' '\.app\.tar\.gz$' '\.app\.tar\.gz\.sig$' '^latest\.json$'; do
            echo "$names" | tr ' ' '\n' | grep -qE "$pat" \
              || { echo "::error::缺少产物: $pat"; exit 1; }
          done
          echo "✓ .dmg / .app.tar.gz / .sig / latest.json 四类齐备"
