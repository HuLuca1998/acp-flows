name: ci

# 设计规范见 docs/rules/ci.md。三条核心规则：
#   ① 只跑受影响的部分（changes 探测 → 各 job if 守卫）
#   ② 分支保护只认最后的 ci 汇总门禁，不认单个 job
#      —— 否则被跳过的 required check 会让 PR 永远 pending
#   ③ 便宜的先跑，让违规尽早暴露
#
# ★ 每个 job 都必须有 timeout-minutes。GitHub 的默认上限是 **6 小时**，
#   而 macOS runner 按 10 倍计费——一个卡死的 shell job 就能烧掉
#   60 小时的额度。上限按实测耗时的 3–5 倍给：够宽松不误杀，卡死时能止损。
#
# changes 除了探测「改了什么」，还探测「有没有脚手架」：
# 子项目尚未创建时（M0 之前）相关 job 直接跳过，而不是在 setup-go 上硬失败。
# 这样 CI 从第一天起就能跑通——一个跑不动的检查等于没有检查。

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 变更探测：~10s，决定后面跑什么 ────────────────────────────
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend:  ${{ steps.filter.outputs.backend == 'true'  && steps.scaffold.outputs.backend == 'true' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' && steps.scaffold.outputs.frontend == 'true' }}
      shell:    ${{ steps.filter.outputs.shell == 'true'    && steps.scaffold.outputs.shell == 'true' }}
      contract: ${{ steps.filter.outputs.contract }}
      has_backend:  ${{ steps.scaffold.outputs.backend }}
      has_frontend: ${{ steps.scaffold.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'api/openapi.yaml'
              - 'scripts/gen/gen-api.sh'
              - 'scripts/check/check-coverage.sh'
            frontend:
              - 'frontend/**'
              - 'api/openapi.yaml'
              - 'scripts/gen/gen-api.sh'
              - 'scripts/check/check-i18n.sh'
            shell:
              - 'shell/**'
            contract:
              - 'api/**'
              - 'scripts/gen/gen-api.sh'

      - id: scaffold
        name: 探测子项目是否已脚手架
        run: |
          for pair in "backend:backend/go.mod" \
                      "frontend:frontend/package.json" \
                      "shell:shell/src-tauri/Cargo.toml"; do
            key=${pair%%:*}; file=${pair#*:}
            if [ -f "$file" ]; then echo "$key=true" >> "$GITHUB_OUTPUT"
            else echo "$key=false" >> "$GITHUB_OUTPUT"; echo "· $key 尚未脚手架（缺 $file）"; fi
          done

  # ── 全局规范：~30s，永远跑（便宜且覆盖整个仓库）────────────────
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 关键目录都有填实的 AGENTS.md + CLAUDE.md
        run: make check-docs

      - name: 工具库索引 / 测试索引 / i18n 词条一致
        run: make check-index

      - name: 命名与文件组织规范
        run: bash scripts/check/check-naming.sh

      - name: 文档里的命令与脚本真实存在
        run: bash scripts/check/check-doc-commands.sh

      - name: 文档里的相对链接有效
        run: bash scripts/check/check-doc-links.sh

      # 文档超预算不会报错，只会表现为「AI 好像没按文档做」——所以必须机器拦
      - name: 文档的上下文预算（L0 常驻 / L1 阶段 / L2 读法块）
        run: bash scripts/check/check-doc-budget.sh

      # 平铺过量没人会主动发现——它的第一个症状是目录索引文档悄悄漂移
      - name: 目录扇出（平铺文件过多要分包）
        run: bash scripts/check/check-dir-fanout.sh

      # 里程碑是另一个 AI 的施工图，缺一个字段它就会改不该改的
      - name: 里程碑单元四要素与验收断言齐备
        run: bash scripts/check/check-milestones.sh

      - name: 提交信息格式（含「先红的测试」）
        if: github.event_name == 'pull_request'
        run: bash scripts/check/check-commit-msg.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  # ── 契约：只在 api/ 变动时跑 ─────────────────────────────────
  contract:
    name: contract
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      # 版本写死：@latest 会让一个与本次改动无关的 PR 突然变红
      - name: spec 自身规范性
        run: npx --yes @redocly/cli@1.34.5 lint api/openapi.yaml

      - uses: actions/setup-go@v5
        if: needs.changes.outputs.has_backend == 'true'
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # 仓库根没有 package.json，不指 package_json_file 会报
      # 「No pnpm version is specified」。版本真源是各子项目的 packageManager 字段。
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.has_frontend == 'true'
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.has_frontend == 'true'
        with: { node-version: 22, cache: pnpm, cache-dependency-path: '**/pnpm-lock.yaml' }

      # ★ 必须装依赖：make gen 的 TS 那一半靠 pnpm exec openapi-typescript
      - name: 装前端依赖
        if: needs.changes.outputs.has_frontend == 'true'
        run: cd frontend && pnpm install --frozen-lockfile

      - name: 生成物与 spec 一致
        if: needs.changes.outputs.has_backend == 'true' || needs.changes.outputs.has_frontend == 'true'
        run: make check-gen

  # ── 后端：只在 backend/ 或契约变动时跑 ────────────────────────
  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # ★ 两处都要对：
      #   action 必须 ≥ v7（v6 不认 .golangci.yml 的 version: "2"）
      #   golangci-lint 版本必须写死且用 ≥ go.mod 的 Go 构建，
      #   否则报「the Go language version used to build golangci-lint is lower than
      #   the targeted Go version」——而这条只在 CI 上出现，本地看不见
      - uses: golangci/golangci-lint-action@v8
        with:
          working-directory: backend
          version: v2.12.2

      - name: 单元测试（-race）
        run: make test-backend

      - name: 集成测试
        run: cd backend && go test -tags=integration ./tests/... -count=1

      - name: 覆盖率门槛
        run: make cover

  # ── 前端：只在 frontend/ 或契约变动时跑 ───────────────────────
  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: '**/pnpm-lock.yaml' }

      - run: cd frontend && pnpm install --frozen-lockfile

      - name: typecheck + lint（含设计合规规则）
        run: make lint-frontend

      - name: Vitest
        run: make test-frontend

  # ── 外壳：只在 shell/ 变动时跑（macOS runner 贵，能不跑就不跑）──
  shell:
    name: shell
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: shell/src-tauri }

      # ★ tauri.conf.json 的 externalBin 声明了 binaries/duetd-<triple>，
      # 文件不在时**任何** cargo 命令都会失败（连 clippy 都跑不了），
      # 报的是 `resource path binaries/duetd-<triple> doesn't exist`。
      # sidecar 只是给 cargo 一个「文件存在」的占位——clippy 不会执行它。
      # 真编一遍 Go 要 30–60s，而这里跑在 **10 倍计费**的 macOS runner 上。
      # 用一个空文件顶替，把 Go 编译整个省掉。
      # 真实产物由 release workflow 编（那里才需要能跑的二进制）。
      - name: 放置 sidecar 占位
        run: |
          set -euo pipefail
          mkdir -p shell/src-tauri/binaries
          for triple in aarch64-apple-darwin x86_64-apple-darwin; do
            : > "shell/src-tauri/binaries/duetd-$triple"
            chmod +x "shell/src-tauri/binaries/duetd-$triple"
          done

      # clippy --all-targets 已经编过 test 目标了，再跑 cargo test 只是
      # 把同一批产物链接一遍。壳这一层没有单元测试（行为只能靠真包验，
      # 见 shell/src-tauri/src/CLAUDE.md），所以不值得为它多花一轮 macOS 时间。
      - run: cd shell/src-tauri && cargo clippy --all-targets -- -D warnings

  # ── 汇总门禁 ★ 分支保护只 required 这一个 ─────────────────────
  # 被跳过的 job 算通过；失败或被取消才算不通过。
  # 这样跳过 job 不会让 PR 永远 pending，但也不会放过真失败。
  ci:
    name: ci
    if: always()
    needs: [changes, guard, contract, backend, frontend, shell]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 检查所有 job 结果
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "各 job 结果: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "✗ 有 job 未通过（$r）"; exit 1 ;;
            esac
          done
          echo "✓ CI 通过"

  # ── E2E：只在 main 上跑，不阻塞 PR（慢，且依赖构建产物）────────
  e2e:
    name: e2e
    needs: changes
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.has_backend == 'true'
      && needs.changes.outputs.has_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v4
        with: { package_json_file: e2e/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: '**/pnpm-lock.yaml' }

      - run: make build
      - run: cd e2e && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - run: make test-e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
